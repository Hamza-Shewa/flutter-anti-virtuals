name: Publish to pub.dev

# Publishes when a version tag is pushed, for example `git tag v0.1.0 && git push --tags`.
# One-time setup on pub.dev: Admin tab of the package -> Automated publishing ->
# enable "Publishing from GitHub Actions" for this repository with the tag
# pattern `v{{version}}`. No token is stored in GitHub; pub.dev trusts the
# workflow through OpenID Connect.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
    with:
      environment: pub.dev
