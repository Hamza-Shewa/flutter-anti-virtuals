name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dart:
    name: Analyze and test (Dart)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
      - name: Publish dry run
        run: dart pub publish --dry-run

  verifier:
    name: Server verifier (Dart)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/anti_virtuals_verifier
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test example
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Publish dry run
        run: dart pub publish --dry-run

  android:
    name: Build and unit-test (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.3.1'
      - name: Build the example app (compiles the Kotlin plugin)
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug
      - name: Kotlin unit tests
        run: gradle --project-dir example/android :flutter_anti_virtuals:testDebugUnitTest

  android-integration:
    name: Integration tests (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the test app before the emulator starts
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug
      - name: Run the integration tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: example
          script: ../.github/scripts/integration_tests.sh

  ios:
    name: Build (iOS)
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      # Swift Package Manager derives a package's identity from its directory name, and Flutter
      # links a path plugin by that name, so the checkout directory has to be the plugin name
      # (underscores, not the repository name with hyphens).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: flutter_anti_virtuals
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Build the example app for a device (compiles the Swift plugin)
        working-directory: flutter_anti_virtuals/example
        run: |
          flutter pub get
          flutter build ios --debug --no-codesign
      - name: Build the example app for the Simulator
        working-directory: flutter_anti_virtuals/example
        run: flutter build ios --simulator --debug
      - name: Pick a Simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, list_ in devices.items() if 'iOS' in runtime
                     for d in list_ if d['name'].startswith('iPhone')))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Boot the Simulator
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
      # Without parallel testing xcodebuild uses the booted Simulator instead of booting a clone.
      - name: Swift unit tests (Simulator)
        working-directory: flutter_anti_virtuals/example/ios
        run: |
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -parallel-testing-enabled NO -quiet
      # The limit covers the Xcode build that `flutter test` runs before the tests.
      - name: Integration tests (Simulator)
        working-directory: flutter_anti_virtuals/example
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          INTEGRATION_TEST_LIMIT: 600
        run: ../.github/scripts/integration_tests.sh
