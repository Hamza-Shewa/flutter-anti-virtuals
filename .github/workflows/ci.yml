name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Analyze and test (Dart)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
      - name: Publish dry run
        run: dart pub publish --dry-run

  android:
    name: Build and unit-test (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build the example app (compiles the Kotlin plugin)
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug
      - name: Kotlin unit tests
        run: gradle --project-dir example/android :flutter_anti_virtuals:testDebugUnitTest

  android-integration:
    name: Integration tests (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the test app before the emulator starts
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug
      - name: Run the integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: example
          script: flutter test integration_test --dart-define=EXPECT_EMULATOR=true

  ios:
    name: Build (iOS)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      # Swift Package Manager derives a package's identity from its directory name, and Flutter
      # links a path plugin by that name, so the checkout directory has to be the plugin name
      # (underscores, not the repository name with hyphens).
      - uses: actions/checkout@v4
        with:
          path: flutter_anti_virtuals
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build the example app for a device (compiles the Swift plugin)
        working-directory: flutter_anti_virtuals/example
        run: |
          flutter pub get
          flutter build ios --debug --no-codesign
      - name: Build the example app for the Simulator
        working-directory: flutter_anti_virtuals/example
        run: flutter build ios --simulator --debug
      - name: Pick a Simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, list_ in devices.items() if 'iOS' in runtime
                     for d in list_ if d['name'].startswith('iPhone')))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Swift unit tests (Simulator)
        working-directory: flutter_anti_virtuals/example/ios
        run: |
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -destination "id=${{ steps.simulator.outputs.udid }}" -quiet
      - name: Integration tests (Simulator)
        working-directory: flutter_anti_virtuals/example
        run: |
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          flutter test integration_test -d "${{ steps.simulator.outputs.udid }}" \
            --dart-define=EXPECT_EMULATOR=true
