name: flutter_anti_virtuals
description: "Detects VPNs, proxies, mock location, virtual cameras, root, hooks and emulators on Android and iOS, with basic checks on desktop and the web."
version: 0.4.0
repository: https://github.com/Hamza-Shewa/flutter-anti-virtuals
issue_tracker: https://github.com/Hamza-Shewa/flutter-anti-virtuals/issues
topics:
  - security
  - integrity
  - vpn
  - root-detection
  - anti-fraud

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.shewa.flutter_anti_virtuals
        pluginClass: FlutterAntiVirtualsPlugin
      ios:
        pluginClass: FlutterAntiVirtualsPlugin
      # Checks written in Dart on these platforms (see the README).
      macos:
        dartPluginClass: FlutterAntiVirtualsDesktop
        dartFileName: src/platform/desktop/desktop_platform.dart
      windows:
        dartPluginClass: FlutterAntiVirtualsDesktop
        dartFileName: src/platform/desktop/desktop_platform.dart
      linux:
        dartPluginClass: FlutterAntiVirtualsDesktop
        dartFileName: src/platform/desktop/desktop_platform.dart
      web:
        pluginClass: FlutterAntiVirtualsWeb
        fileName: src/platform/web_plugin.dart
